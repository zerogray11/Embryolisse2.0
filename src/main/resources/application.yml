spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/embryolisse # Local PostgreSQL database
    username: postgres # Default PostgreSQL username
    password: morocaan # Your PostgreSQL password
    driver-class-name: org.postgresql.Driver # PostgreSQL driver
    hikari:
      maximum-pool-size: 5 # Connection pool size
  jpa:
    hibernate:
      ddl-auto: update # Automatically update the schema
    show-sql: true # Show SQL queries in logs
    properties:
      hibernate:
        format_sql: true # Format SQL queries for better readability
  main:
    lazy-initialization: true # Enable lazy initialization to speed up startup

server:
  port: 8080 # Local development port

logging:
  level:
    org.springframework: DEBUG # Enable debug logging for Spring
    org.hibernate: DEBUG # Enable debug logging for Hibernate
    com.embryolisse: DEBUG # Enable debug logging for your application packages